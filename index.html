<style>
  :root{
    --bg: #E7E9E7;
    --card: #FFFFFF;
    --ink: #232A2E;
    --ink-soft: #64707A;
    --accent: #C8791E;
    --warn: #B0413A;
    --line: #D3D7D6;
    --white: #FFFFFF;
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg); color: var(--ink); font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh; display:flex; justify-content:center;
  }
  .mono{ font-family: 'JetBrains Mono', monospace; }
  button{ font-family: inherit; }
  .phone{ width: 100%; max-width: 460px; min-height: 100vh; background: var(--bg); display:flex; flex-direction:column; position:relative; }
  .banner{ background: var(--ink); color: var(--white); font-size: 12px; line-height: 1.5; padding: 10px 16px; display: none; }
  .banner.show{ display:block; }
  .banner.banner-warn{ background: var(--warn); }
  .sticky-top{ position: sticky; top:0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top); }
  .masthead{ background: var(--card); margin: 14px 14px 0 14px; border-radius: 12px 12px 0 0; padding: 16px 18px 14px 18px; border-top: 4px solid var(--accent); }
  .masthead-top{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size: 13px; letter-spacing: 1.5px; color: var(--ink); }
  .text-btn{ background:none; border:none; color: var(--ink-soft); font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; padding: 6px 4px; cursor:pointer; border-bottom: 1px dotted var(--ink-soft); }
  .text-btn:hover{ color: var(--warn); border-color: var(--warn); }
  .sync-row{ display:flex; align-items:center; gap: 6px; margin-top: 10px; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-soft); }
  .sync-dot{ width: 7px; height:7px; border-radius:50%; background: var(--ink-soft); flex-shrink:0; }
  .sync-dot.synced{ background: #4F7A4A; }
  .sync-dot.offline{ background: var(--warn); }
  .refresh-btn{ background:none; border:none; color: var(--ink-soft); font-size: 13px; cursor:pointer; margin-left:auto; padding:2px 4px; }
  .identity-row{ display:flex; align-items:center; gap: 6px; margin-top: 8px; font-size: 11px; color: var(--ink-soft); }
  .identity-row b{ color: var(--ink); font-weight: 700; }
  .identity-switch{ background:none; border:none; color: var(--ink-soft); font-size: 11px; cursor:pointer; text-decoration: underline; padding: 0; }
  .identity-grid{ display:flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .identity-btn{ flex: 1 1 28%; min-width: 96px; padding: 16px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--white); color: var(--ink); font-size: 14px; font-weight: 600; cursor:pointer; text-align:center; }
  .identity-btn:hover{ border-color: var(--accent); }
  .headline{ margin-top: 12px; }
  .headline-num{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size: 30px; line-height:1.1; }
  .headline-sub{ font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .my-tasks-card{ background: var(--card); border-radius: 12px; padding: 12px 16px; margin: 10px 14px; }

<script>
/* ============================================================
   SETUP — read this before using the app
   ------------------------------------------------------------
   Use a SEPARATE Firebase project from any other app you've
   built (e.g. a household budget tracker). The open rules below
   make the WHOLE database visible to anyone with the URL, so
   keeping this on its own project keeps it from mixing with
   anything else.

   1. Go to https://console.firebase.google.com and sign in.
   2. Click "Add project" (e.g. "shop-floor-log").
   3. Build -> Realtime Database -> Create Database -> test mode.
   4. Rules tab, set:
        { "rules": { ".read": true, ".write": true } }
      Publish.
   5. Data tab -> copy the URL at the top
      (looks like https://shop-floor-log-xxxxx-default-rtdb.firebaseio.com)
   6. Paste it below as FIREBASE_URL, replacing the placeholder.
   7. Host this file the same way as before (e.g. GitHub Pages) so
      both you and your supervisor open it from a real web address.
   ============================================================ */
const FIREBASE_URL = "https://supervisor-app-4c0b3-default-rtdb.firebaseio.com";

// ---- departments ----
const DEPARTMENTS = [
  {key:'milling', label:'Milling', short:'Milling', type:'standard',
    issues:['Wrong Species','Not hitting width spec after SLR']},
  {key:'glueup', label:'Glue Up / Wide Belt', short:'Glue/Widebelt', type:'standard',
    issues:['Open Glue Seam','Not able to hit thickness','Under Width after Glue']},
  {key:'cnc', label:'CNC', short:'CNC', type:'standard',
    issues:['Failed Table','Table Requires fixing']},
  {key:'sanding', label:'Sanding', short:'Sanding', type:'standard',
    issues:['Table failed','Table needed repair']},
  {key:'fullcustom', label:'Full Custom', short:'Full Custom', type:'standard',
    issues:['Item had to be redone','Item had to be reworked']},
  {key:'finish', label:'Finish Department', short:'Finish', type:'standard',
    issues:["Didn't meet color spec",'Junk in finish','Sheen Issue']},
  {key:'metal', label:'Metal Department', short:'Metal', type:'standard',
    issues:['Item had to be scrapped','Item had to be reworked']},
  {key:'assembly', label:'Assembly/Storage', short:'Assembly/Storage', type:'standard',
    issues:['Screw through table','Damaged table during assembly','Damaged base during assembly','Table damaged in storage','Table damaged being moved through shop']},
  {key:'arrow', label:'ARROW — Powdercoating Tracking', short:'Arrow', type:'arrow'},
  {key:'qc', label:'QC', short:'QC', type:'qc'},
  {key:'maintenance', label:'Routine Tasks', short:'Routine Tasks', type:'maintenance'},
  {key:'delivery', label:'Delivery', short:'Delivery', type:'standard',
    issues:['Product damaged by PD','Product Damaged by customer','Missing Product on site','No site contact']},
  {key:'settings', label:'Settings', short:'Settings', type:'settings'},
];
const MAINT_ADMINS = ['Luke H', 'David D'];
const SETTINGS_ADMIN = 'Luke H';
function canManageMaintenance(){ return MAINT_ADMINS.includes(currentUser); }
const FULL_ACCESS_USERS = ['Luke H', 'David D'];
const PERSON_DEPTS = {
  'Eric B': ['fullcustom', 'finish', 'qc'],
  'KP': ['arrow', 'qc', 'assembly'],
  'Donnie E': ['milling', 'glueup', 'cnc'],
  'Mike B': ['sanding', 'finish'],
  'Shawn K': ['delivery', 'qc', 'arrow', 'assembly'],
  'Willie J': ['metal', 'arrow'],
  'Jim W': ['finish'],
};
function isDeptVisible(d){
  if (d.type === 'settings') return currentUser === SETTINGS_ADMIN;
  if (d.type === 'maintenance') return true;
  if (FULL_ACCESS_USERS.includes(currentUser)) return true;
  const allowed = PERSON_DEPTS[currentUser];
  if (!allowed) return true;
  return allowed.includes(d.key);
}
function firstVisibleDept(){
  const d = DEPARTMENTS.find(isDeptVisible);
  return d ? d.key : 'overview';
}
const STORAGE_KEY = 'shop_floor_log_cache_v1';
const IDENTITY_KEY = 'shop_floor_log_identity_v1';
const TEAM = ['Luke H','Mike B','Jim W','Eric B','David D','Donnie E','KP','Shawn K','Willie J'];
const POLL_MS = 15000;
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let issues = [];
let arrowJobs = [];
let qcEntries = [];
let maintenanceItems = [];
let maintenanceLogs = [];
let expandedMaintId = null;
let activeDept = DEPARTMENTS[0].key;
let currentUser = null;
let qcSearch = '';
const today = new Date();
let overviewPeriod = 'month';
let overviewMonthCursor = { y: today.getFullYear(), m: today.getMonth() };
let overviewYearCursor = today.getFullYear();
let expandedDept = null;
let expandedIssueId = null;

function todayISO(){
  const y = today.getFullYear(), m = String(today.getMonth()+1).padStart(2,'0'), d = String(today.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function currentYM(){ return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`; }
function parseISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function formatShortDate(iso){ const d = parseISO(iso); return `${MONTH_SHORT[d.getMonth()]} ${d.getDate()}`; }
function daysBetween(startISO, endISO){ return Math.round((parseISO(endISO) - parseISO(startISO)) / 86400000); }
function addDaysISO(iso, days){
  const d = parseISO(iso);
  d.setDate(d.getDate() + days);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isoOfDate(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const OCCURRENCE_LABELS = {1:'1st', 2:'2nd', 3:'3rd', 4:'4th', '-1':'Last'};
function nthWeekdayOfMonth(year, monthIndex, weekday, occurrence){
  if (occurrence === -1) {
    let d = new Date(year, monthIndex+1, 0); // last day of month
    while (d.getDay() !== weekday) d.setDate(d.getDate()-1);
    return d;
  }
  let count = 0;
  let d = new Date(year, monthIndex, 1);
  while (d.getMonth() === monthIndex) {
    if (d.getDay() === weekday) { count++; if (count === occurrence) return new Date(d); }
    d.setDate(d.getDate()+1);
  }
  return null; // e.g. asked for 5th occurrence and month only has 4
}
function computeAnchor(item){
  if (item.scheduleType === 'weekly') {
    let d = parseISO(item.startDate);
    while (d.getDay() !== item.weekday) d.setDate(d.getDate()+1);
    return isoOfDate(d);
  }
  let d = parseISO(item.startDate);
  let year = d.getFullYear(), month = d.getMonth();
  for (let i = 0; i < 24; i++) {
    const occ = nthWeekdayOfMonth(year, month, item.weekday, item.monthlyOccurrence);
    if (occ && isoOfDate(occ) >= item.startDate) return isoOfDate(occ);
    month++; if (month > 11) { month = 0; year++; }
  }
  return item.startDate;
}
function scheduleLabel(item){
  if (!item.scheduleType) return item.intervalDays ? `Every ${item.intervalDays} days` : 'Custom schedule';
  const wd = WEEKDAY_NAMES[item.weekday];
  if (item.scheduleType === 'monthly') return `${OCCURRENCE_LABELS[item.monthlyOccurrence] || '1st'} ${wd} of every month`;
  return item.weekInterval === 1 ? `Every ${wd}` : `Every ${item.weekInterval} weeks (${wd})`;
}
function nextDueISO(item){
  const logs = maintenanceLogs.filter(l => l.itemId === item.id);
  const lastDate = logs.length ? logs.reduce((max, l) => (l.date > max ? l.date : max), logs[0].date) : null;
  const searchFrom = lastDate ? addDaysISO(lastDate, 1) : item.startDate;

  // legacy fallback for any item created before weekday-based scheduling existed
  if (!item.scheduleType) return lastDate ? addDaysISO(lastDate, item.intervalDays) : item.startDate;

  if (item.scheduleType === 'weekly') {
    const anchor = computeAnchor(item);
    let d = parseISO(searchFrom < anchor ? anchor : searchFrom);
    while (true) {
      if (d.getDay() === item.weekday) {
        const weeksSinceAnchor = Math.round(daysBetween(anchor, isoOfDate(d)) / 7);
        if (weeksSinceAnchor >= 0 && weeksSinceAnchor % item.weekInterval === 0) return isoOfDate(d);
      }
      d.setDate(d.getDate()+1);
    }
  }
  // monthly
  let d = parseISO(searchFrom);
  let year = d.getFullYear(), month = d.getMonth();
  for (let i = 0; i < 24; i++) {
    const occ = nthWeekdayOfMonth(year, month, item.weekday, item.monthlyOccurrence);
    if (occ) { const occISO = isoOfDate(occ); if (occISO >= searchFrom) return occISO; }
    month++; if (month > 11) { month = 0; year++; }
  }
  return searchFrom;
}
function escapeHTML(s){ const div = document.createElement('div'); div.textContent = s == null ? '' : s; return div.innerHTML; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}
function isConfigured(){ return FIREBASE_URL && FIREBASE_URL.indexOf('PASTE_YOUR') === -1 && FIREBASE_URL.indexOf('http') === 0; }
function objToArr(obj){ if (!obj) return []; return Object.entries(obj).map(([id, v]) => ({ id, ...v })); }

// ---------- local cache (offline fallback only) ----------
function cacheLocal(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify({issues, arrowJobs, qcEntries, maintenanceItems, maintenanceLogs})); } catch(e){} }
function loadLocalCache(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    issues = d.issues || []; arrowJobs = d.arrowJobs || []; qcEntries = d.qcEntries || [];
    maintenanceItems = d.maintenanceItems || []; maintenanceLogs = d.maintenanceLogs || [];
  } catch(e){}
}
function loadIdentity(){ try { return localStorage.getItem(IDENTITY_KEY) || null; } catch(e){ return null; } }
function saveIdentity(name){ try { localStorage.setItem(IDENTITY_KEY, name); } catch(e){} }
function clearIdentity(){ try { localStorage.removeItem(IDENTITY_KEY); } catch(e){} currentUser = null; activeDept = DEPARTMENTS[0].key; render(); }

// ---------- cloud sync (Firebase Realtime Database REST) ----------
function setSyncStatus(status){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  const banner = document.getElementById('banner');
  dot.classList.remove('synced','offline');
  if (status === 'synced'){
    dot.classList.add('synced'); text.textContent = 'Synced with shared log';
    banner.classList.remove('show','banner-warn');
  } else if (status === 'syncing'){
    text.textContent = 'Syncing…';
  } else if (status === 'offline'){
    dot.classList.add('offline'); text.textContent = "Can't reach shared log";
    banner.textContent = "Can't reach the shared log right now. New entries are saved on this device and will sync once you're back online.";
    banner.classList.add('show','banner-warn');
  } else if (status === 'unconfigured'){
    text.textContent = 'Not connected yet';
    banner.textContent = "This copy isn't linked to a shared log yet. Open the file and paste your Firebase database URL where it says FIREBASE_URL (see the setup notes at the top of the code).";
    banner.classList.add('show'); banner.classList.remove('banner-warn');
  } else {
    text.textContent = 'Connecting…';
  }
}
async function remoteFetchPath(path){
  const res = await fetch(`${FIREBASE_URL}/${path}.json`, { cache: 'no-store' });
  if (!res.ok) throw new Error('fetch failed');
  return await res.json();
}
async function remotePatchPath(path, body){
  const res = await fetch(`${FIREBASE_URL}/${path}.json`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('patch failed');
}
async function remoteReplacePath(path, body){
  const res = await fetch(`${FIREBASE_URL}/${path}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('put failed');
}
async function syncPull(showFailToast){
  if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
  try {
    setSyncStatus('syncing');
    const [i, a, q, mi, ml] = await Promise.all([
      remoteFetchPath('issues'), remoteFetchPath('arrowJobs'), remoteFetchPath('qcEntries'),
      remoteFetchPath('maintenanceItems'), remoteFetchPath('maintenanceLogs')
    ]);
    const newIssues = objToArr(i), newArrow = objToArr(a), newQc = objToArr(q);
    const newMaintItems = objToArr(mi), newMaintLogs = objToArr(ml);
    const before = {issues, arrowJobs, qcEntries, maintenanceItems, maintenanceLogs};
    const after = {issues:newIssues, arrowJobs:newArrow, qcEntries:newQc, maintenanceItems:newMaintItems, maintenanceLogs:newMaintLogs};
    const changed = JSON.stringify(before) !== JSON.stringify(after);
    issues = newIssues; arrowJobs = newArrow; qcEntries = newQc;
    maintenanceItems = newMaintItems; maintenanceLogs = newMaintLogs;
    cacheLocal();
    setSyncStatus('synced');
    if (changed) render();
  } catch (e) {
    setSyncStatus('offline');
    if (showFailToast) showToast("Couldn't reach the shared log — showing last synced copy");
  }
}

// ---------- modal ----------

          <button class="modal-cancel" id="modalCancel">Cancel</button>
          <button class="modal-confirm" id="modalConfirm">${confirmLabel}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalCancel').onclick = () => root.innerHTML = '';
  document.getElementById('modalOverlay').onclick = (e) => { if (e.target.id === 'modalOverlay') root.innerHTML = ''; };
  document.getElementById('modalConfirm').onclick = () => { root.innerHTML = ''; onConfirm(); };
}

}
function attachIdentityHandlers(){
  document.querySelectorAll('[data-pick]').forEach(btn => {

}

// ---------- chip bar + masthead ----------
function chipBadge(dept){
  if (dept.type === 'standard') return issues.filter(i => i.department === dept.key && i.date.startsWith(currentYM())).length;
  if (dept.type === 'arrow') return arrowJobs.filter(j => !j.returnedDate).length;
  if (dept.type === 'qc') return qcEntries.filter(q => q.date.startsWith(currentYM())).length;
  if (dept.type === 'maintenance') return maintenanceItems.filter(item => daysBetween(todayISO(), nextDueISO(item)) <= 0).length;
  return 0;
}
function renderChips(){
  const wrap = document.getElementById('deptNav');
  const overviewHTML = `<button class="dept-chip pinned${activeDept==='overview'?' active':''}" data-dept="overview">Overview</button>`;
  const visibleDepts = DEPARTMENTS.filter(isDeptVisible);
  const deptHTML = visibleDepts.map(d => {
    const badge = chipBadge(d);
    return `<button class="dept-chip${d.key===activeDept?' active':''}" data-dept="${d.key}">${escapeHTML(d.short)}${badge>0?`<span class="chip-badge">${badge}</span>`:''}</button>`;
  }).join('');
  wrap.innerHTML = overviewHTML + deptHTML;
  wrap.querySelectorAll('[data-dept]').forEach(btn => {
    btn.onclick = () => { activeDept = btn.getAttribute('data-dept'); render(); };
  });
}
function renderMasthead(){
  const ym = currentYM();
  const count = issues.filter(i => i.date.startsWith(ym)).length;
  document.getElementById('headlineNum').textContent = String(count);
  document.getElementById('headlineSub').textContent = `issues logged this month, across ${DEPARTMENTS.filter(d=>d.type==='standard').length} departments`;
  const idRow = document.getElementById('identityRow');
  if (idRow) {
    idRow.innerHTML = `Logged in as <b>${escapeHTML(currentUser || '')}</b> <button class="identity-switch" id="switchUserBtn">Not you?</button>`;

  }
  const stripEl = document.getElementById('myTasksStrip');
  if (stripEl) {
    stripEl.innerHTML = myTasksHTML();
    document.querySelectorAll('[data-complete-maint-ov]').forEach(btn => {
      btn.onclick = () => markMaintenanceComplete(btn.getAttribute('data-complete-maint-ov'));
    });

}

// ---------- STANDARD department (issue log) ----------
function renderStandardDept(dept){
  const deptIssues = issues.filter(i => i.department === dept.key)
    .sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));
  const monthCount = deptIssues.filter(i => i.date.startsWith(currentYM())).length;
  const options = dept.issues.map(label => `<option value="${escapeHTML(label)}">${escapeHTML(label)}</option>`).join('');
  const listHTML = deptIssues.length ? deptIssues.map(i => {
    const expanded = expandedIssueId === i.id;
    return `
    <div class="issue-row">
      <div class="issue-summary">
        <button class="issue-toggle" data-toggle-issue="${i.id}">
          ${i.projectNumber ? `<span class="line-label mono">#${escapeHTML(i.projectNumber)}</span>` : ''}
          <span class="line-label">${escapeHTML(i.category)}</span>
        </button>
        <button class="del-btn" data-del-issue="${i.id}">&times;</button>
      </div>
      ${expanded ? `<div class="issue-detail">${formatShortDate(i.date)}${i.loggedBy ? ` — Logged by ${escapeHTML(i.loggedBy)}` : ''}${i.note ? ` — ${escapeHTML(i.note)}` : ' — no additional notes'}</div>` : ''}
    </div>`;
  }).join('') : `<div class="empty-state">No issues logged yet for ${escapeHTML(dept.label)}.</div>`;

  return `
    <div class="card">
      <div class="dept-title">${escapeHTML(dept.label)}</div>
      <div class="muted">${monthCount} logged this month</div>
      <label class="field-label" for="issueProjectNum">Project #</label>
      <input type="text" id="issueProjectNum" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 432">
      <label class="field-label" for="issueCategory">Issue type</label>
      <select id="issueCategory">${options}</select>
      <label class="field-label" for="issueDate">Date</label>
      <input type="date" id="issueDate" value="${todayISO()}">
      <label class="field-label" for="issueNote">Notes <span style="text-transform:none;letter-spacing:0;">(optional)</span></label>
      <input type="text" id="issueNote" placeholder="Any additional detail">
      <button class="add-btn" id="logIssueBtn">+ Log issue</button>
    </div>
    <div class="section-title">History <span style="text-transform:none;letter-spacing:0;">(tap an entry for details)</span></div>
    <div class="card">${listHTML}</div>
  `;
}
function attachStandardHandlers(dept){
  document.getElementById('logIssueBtn').onclick = async () => {
    const projectEl = document.getElementById('issueProjectNum');
    const projectNumber = projectEl.value.trim();
    const category = document.getElementById('issueCategory').value;
    const date = document.getElementById('issueDate').value || todayISO();
    const note = document.getElementById('issueNote').value.trim();
    if (!projectNumber) {
      projectEl.style.borderColor = 'var(--warn)';
      showToast('Enter a project number');
      return;
    }
    const entry = { id: 'i' + Date.now() + Math.random().toString(36).slice(2,7), department: dept.key, projectNumber, category, date, note, loggedBy: currentUser, createdAt: Date.now() };
    issues.push(entry); cacheLocal(); render(); showToast('Issue logged');
    if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
    try {
      setSyncStatus('syncing');
      await remotePatchPath('issues', { [entry.id]: { department: entry.department, projectNumber: entry.projectNumber, category: entry.category, date: entry.date, note: entry.note, loggedBy: entry.loggedBy, createdAt: entry.createdAt } });
      setSyncStatus('synced');
    } catch (e) { setSyncStatus('offline'); showToast("Saved here — will sync once you're back online"); }
  };
  document.querySelectorAll('[data-toggle-issue]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-toggle-issue');
      expandedIssueId = expandedIssueId === id ? null : id;
      render();
    };
  });
  document.querySelectorAll('[data-del-issue]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-del-issue');
      openModal({
        title: 'Remove this entry?',
        text: "This removes it from the shared log for everyone. This can't be undone.",
        confirmLabel: 'Remove',
        onConfirm: async () => {
          issues = issues.filter(i => i.id !== id); cacheLocal(); render(); showToast('Entry removed');
          if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
          try { await remotePatchPath('issues', { [id]: null }); setSyncStatus('synced'); }
          catch (e) { setSyncStatus('offline'); showToast("Removed here — will sync once you're back online"); }
        }
      });
    };
  });
}

// ---------- ARROW (in/out tracking) ----------
function renderArrow(){
  const active = arrowJobs.filter(j => !j.returnedDate)
    .sort((a,b) => (a.sentDate < b.sentDate ? 1 : a.sentDate > b.sentDate ? -1 : b.createdAt - a.createdAt));
  const returned = arrowJobs.filter(j => j.returnedDate)
    .sort((a,b) => (a.returnedDate < b.returnedDate ? 1 : -1));

  const activeHTML = active.length ? active.map(j => {
    const days = daysBetween(j.sentDate, todayISO());
    return `
    <div class="line-item">
      <span class="line-label mono">#${escapeHTML(j.jobNumber)}</span>
      <span class="line-label">${escapeHTML(j.description)}<span class="line-note"> — sent ${formatShortDate(j.sentDate)}${j.sentBy ? ` by ${escapeHTML(j.sentBy)}` : ''} (${days}d)</span></span>
      <button class="add-btn" style="width:auto; padding:8px 14px; margin:0; font-size:11px;" data-return="${j.id}">Mark Returned</button>
    </div>`;
  }).join('') : `<div class="empty-state">Nothing currently at Arrow.</div>`;

  const returnedHTML = returned.length ? returned.slice(0, 50).map(j => {
    const days = daysBetween(j.sentDate, j.returnedDate);
    return `
    <div class="line-item">
      <span class="line-label mono">#${escapeHTML(j.jobNumber)}</span>
      <span class="line-label">${escapeHTML(j.description)}<span class="line-note"> — ${formatShortDate(j.sentDate)} to ${formatShortDate(j.returnedDate)} (${days}d)${j.returnedBy ? ` · returned by ${escapeHTML(j.returnedBy)}` : ''}</span></span>
      <button class="del-btn" data-del-arrow="${j.id}">&times;</button>
    </div>`;
  }).join('') : `<div class="empty-state">No returned jobs yet.</div>`;

  return `
    <div class="card">
      <div class="dept-title">ARROW — Powdercoating Tracking</div>
      <label class="field-label" for="arrowJobNum">Project #</label>
      <input type="text" id="arrowJobNum" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 432">
      <label class="field-label" for="arrowDesc">Description</label>
      <input type="text" id="arrowDesc" placeholder="e.g. cabinet hinges, black">
      <label class="field-label" for="arrowSentDate">Date sent</label>
      <input type="date" id="arrowSentDate" value="${todayISO()}">
      <button class="add-btn" id="sendArrowBtn">+ Send to Arrow</button>
    </div>
    <div class="section-title">Currently at Arrow</div>
    <div class="card">${activeHTML}</div>
    <div class="section-title">Returned history</div>
    <div class="card">${returnedHTML}</div>
  `;
}
function attachArrowHandlers(){
  document.getElementById('sendArrowBtn').onclick = async () => {
    const jobNumber = document.getElementById('arrowJobNum').value.trim();
    const description = document.getElementById('arrowDesc').value.trim();
    const sentDate = document.getElementById('arrowSentDate').value || todayISO();
    if (!jobNumber) { showToast('Enter a project number'); return; }
    const entry = { id: 'a' + Date.now() + Math.random().toString(36).slice(2,7), jobNumber, description, sentDate, returnedDate: null, sentBy: currentUser, returnedBy: null, createdAt: Date.now() };
    arrowJobs.push(entry); cacheLocal(); render(); showToast('Sent to Arrow');
    if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
    try {
      setSyncStatus('syncing');
      await remotePatchPath('arrowJobs', { [entry.id]: { jobNumber, description, sentDate, returnedDate: null, sentBy: entry.sentBy, returnedBy: null, createdAt: entry.createdAt } });
      setSyncStatus('synced');
    } catch (e) { setSyncStatus('offline'); showToast("Saved here — will sync once you're back online"); }
  };
  document.querySelectorAll('[data-return]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-return');
      const job = arrowJobs.find(j => j.id === id);
      if (!job) return;
      openModal({
        title: 'Mark as returned?',
        text: `Confirm project #${escapeHTML(job.jobNumber)} has returned from Arrow.`,
        confirmLabel: 'Mark Returned',
        onConfirm: async () => {
          job.returnedDate = todayISO();
          job.returnedBy = currentUser;
          cacheLocal(); render(); showToast('Marked returned');
          if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
          try {
            await remotePatchPath('arrowJobs', { [id]: { jobNumber: job.jobNumber, description: job.description, sentDate: job.sentDate, returnedDate: job.returnedDate, sentBy: job.sentBy, returnedBy: job.returnedBy, createdAt: job.createdAt } });
            setSyncStatus('synced');
          } catch (e) { setSyncStatus('offline'); showToast("Updated here — will sync once you're back online"); }
        }
      });
    };
  });
  document.querySelectorAll('[data-del-arrow]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-del-arrow');
      openModal({
        title: 'Delete this record?',
        text: "This removes it from Arrow history for everyone. This can't be undone.",
        confirmLabel: 'Delete',
        onConfirm: async () => {
          arrowJobs = arrowJobs.filter(j => j.id !== id); cacheLocal(); render(); showToast('Deleted');
          if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
          try { await remotePatchPath('arrowJobs', { [id]: null }); setSyncStatus('synced'); }
          catch (e) { setSyncStatus('offline'); showToast("Removed here — will sync once you're back online"); }
        }
      });
    };
  });
}

function renderQC(){
  return `
    <div class="card">
      <div class="dept-title">QC</div>
      <label class="field-label" for="qcOrder">Project #</label>
      <input type="text" id="qcOrder" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 432">
      <label class="field-label" for="qcItem">Item ID</label>
      <input type="text" id="qcItem" placeholder="e.g. CAB-14-B">
      <label class="field-label" for="qcDate">Date</label>
      <input type="date" id="qcDate" value="${todayISO()}">
      <button class="add-btn" id="logQcBtn">+ Log QC'd item</button>
    </div>
    <div class="section-title">Look up a project</div>
    <div class="card">
      <input type="text" id="qcSearchInput" inputmode="numeric" pattern="[0-9]*" placeholder="Search by Project #" value="${escapeHTML(qcSearch)}">
    </div>
    <div id="qcResultsWrap"></div>
  `;
}
function renderQCResults(){
  const search = qcSearch.trim().toLowerCase();
  const filtered = search ? qcEntries.filter(q => q.orderNumber.toLowerCase().includes(search)) : qcEntries;
  const sorted = filtered.slice().sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));
  const listHTML = sorted.length ? sorted.map(q => `
    <div class="line-item">
      <span class="line-label mono">#${escapeHTML(q.orderNumber)}</span>
      <span class="line-label">${escapeHTML(q.itemId)}<span class="line-note"> — ${formatShortDate(q.date)}${q.loggedBy ? ` · ${escapeHTML(q.loggedBy)}` : ''}</span></span>
      <button class="del-btn" data-del-qc="${q.id}">&times;</button>
    </div>`).join('') : `<div class="empty-state">${search ? `No QC items found for project "${escapeHTML(qcSearch)}".` : 'No QC items logged yet.'}</div>`;

  document.getElementById('qcResultsWrap').innerHTML = `
    <div class="section-title">${search ? `Results for "${escapeHTML(qcSearch)}"` : 'All QC entries'}</div>
    <div class="card">${listHTML}</div>
  `;
  document.querySelectorAll('[data-del-qc]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-del-qc');
      openModal({
        title: 'Delete this QC record?',
        text: "This removes it from the shared log for everyone. This can't be undone.",
        confirmLabel: 'Delete',
        onConfirm: async () => {
          qcEntries = qcEntries.filter(q => q.id !== id); cacheLocal(); renderQCResults(); renderChips(); showToast('Deleted');
          if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
          try { await remotePatchPath('qcEntries', { [id]: null }); setSyncStatus('synced'); }
          catch (e) { setSyncStatus('offline'); showToast("Removed here — will sync once you're back online"); }
        }
      });
    };
  });
}
function attachQCHandlers(){
  document.getElementById('logQcBtn').onclick = async () => {
    const orderNumber = document.getElementById('qcOrder').value.trim();
    const itemId = document.getElementById('qcItem').value.trim();
    const date = document.getElementById('qcDate').value || todayISO();
    if (!orderNumber || !itemId) { showToast('Enter both a Project # and Item ID'); return; }
    const entry = { id: 'q' + Date.now() + Math.random().toString(36).slice(2,7), orderNumber, itemId, date, loggedBy: currentUser, createdAt: Date.now() };
    qcEntries.push(entry); cacheLocal(); render(); showToast('QC item logged');
    if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
    try {
      setSyncStatus('syncing');
      await remotePatchPath('qcEntries', { [entry.id]: { orderNumber, itemId, date, loggedBy: entry.loggedBy, createdAt: entry.createdAt } });
      setSyncStatus('synced');
    } catch (e) { setSyncStatus('offline'); showToast("Saved here — will sync once you're back online"); }
  };
  document.getElementById('qcSearchInput').oninput = (e) => { qcSearch = e.target.value; renderQCResults(); };
  renderQCResults();
}

// ---------- OVERVIEW (aggregated across all departments) ----------
function renderOverview(){
  return overviewPeriod === 'month' ? renderOverviewMonth() : renderOverviewYear();
}
function periodToggleHTML(){
  return `
    <div class="period-toggle">
      <button class="toggle-btn${overviewPeriod==='month'?' active':''}" data-period="month">Month</button>
      <button class="toggle-btn${overviewPeriod==='year'?' active':''}" data-period="year">Year</button>
    </div>`;
}
function deptBreakdownHTML(periodIssues){
  const standardDepts = DEPARTMENTS.filter(d => d.type === 'standard');
  const byDept = standardDepts.map(d => ({ dept: d, count: periodIssues.filter(i => i.department === d.key).length }))
    .sort((a,b) => b.count - a.count);
  const maxCount = Math.max(...byDept.map(x => x.count), 1);
  return byDept.map(({dept, count}) => {
    const pct = Math.max(count > 0 ? 4 : 0, Math.round(count / maxCount * 100));
    const expanded = expandedDept === dept.key;
    const byType = {};
    periodIssues.filter(i => i.department === dept.key).forEach(i => { byType[i.category] = (byType[i.category] || 0) + 1; });
    const sortedTypes = Object.entries(byType).sort((a,b) => b[1] - a[1]);
    const topCount = sortedTypes.length ? sortedTypes[0][1] : 0;
    const topNames = sortedTypes.filter(([,c]) => c === topCount).map(([name]) => name);
    const topLine = count > 0 ? `Most common: ${topNames.map(escapeHTML).join(' / ')} (${topCount})` : 'No issues this period';
    const typeRows = sortedTypes.map(([type, c]) => `<div class="type-row"><span>${escapeHTML(type)}</span><span class="mono">${c}</span></div>`).join('');
    return `
      <div class="ov-dept-row">
        <button class="ov-dept-toggle" data-toggle-dept="${dept.key}">
          <div class="bar-row-top"><span>${escapeHTML(dept.label)}</span><span class="mono">${count}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:var(--accent)"></div></div>
          <div class="ov-top-issue">${topLine}</div>
        </button>
        ${expanded ? `<div class="ov-dept-detail">${count > 0 ? typeRows : ''}</div>` : ''}
      </div>`;
  }).join('');
}
function myTasksHTML(){
  const mine = maintenanceItems.filter(item => item.assignedTo === currentUser);
  if (!mine.length) return '';
  const sorted = mine.slice().sort((a,b) => daysBetween(todayISO(), nextDueISO(a)) - daysBetween(todayISO(), nextDueISO(b)));
  const rows = sorted.map(item => {
    const daysUntil = daysBetween(todayISO(), nextDueISO(item));
    const isDue = daysUntil <= 0;
    const statusText = daysUntil === 0 ? 'Due today' : daysUntil < 0 ? `Overdue by ${-daysUntil}d` : `Due in ${daysUntil}d`;
    return `
      <div class="line-item">
        <span class="line-label">${escapeHTML(item.name)}</span>
        <span class="leader"></span>
        <span class="line-note" style="color:${isDue ? 'var(--warn)' : 'var(--ink-soft)'}">${statusText}</span>
        <button class="add-btn" style="width:auto; padding:6px 10px; margin:0 0 0 8px; font-size:11px;" data-complete-maint-ov="${item.id}">Done</button>
      </div>`;
  }).join('');
  return `
    <div class="my-tasks-card">
      <div class="my-tasks-title">Your routine tasks</div>
      ${rows}
    </div>`;
}
function snapshotsHTML(periodIssues, ymOrYear, isYear){
  const activeArrow = arrowJobs.filter(j => !j.returnedDate);
  const returnedInPeriod = arrowJobs.filter(j => j.returnedDate && (isYear ? j.returnedDate.startsWith(String(ymOrYear)) : j.returnedDate.startsWith(ymOrYear)));
  const avgTurnaround = returnedInPeriod.length ? Math.round(returnedInPeriod.reduce((s,j) => s + daysBetween(j.sentDate, j.returnedDate), 0) / returnedInPeriod.length) : null;
  const oldestActive = activeArrow.length ? Math.max(...activeArrow.map(j => daysBetween(j.sentDate, todayISO()))) : null;
  const qcCount = qcEntries.filter(q => isYear ? q.date.startsWith(String(ymOrYear)) : q.date.startsWith(ymOrYear)).length;
  const dueNow = maintenanceItems.filter(item => daysBetween(todayISO(), nextDueISO(item)) <= 0).length;
  const dueSoon = maintenanceItems.filter(item => { const d = daysBetween(todayISO(), nextDueISO(item)); return d > 0 && d <= 7; }).length;
  return `
    <div class="section-title">Arrow snapshot</div>
    <div class="card">
      <div class="line-item"><span class="line-label">Currently at Arrow</span><span class="leader"></span><span class="line-amount mono">${activeArrow.length}</span></div>
      <div class="line-item"><span class="line-label">Longest active job</span><span class="leader"></span><span class="line-amount mono">${oldestActive !== null ? oldestActive + 'd' : '—'}</span></div>
      <div class="line-item"><span class="line-label">Avg turnaround (returned this period)</span><span class="leader"></span><span class="line-amount mono">${avgTurnaround !== null ? avgTurnaround + 'd' : '—'}</span></div>
    </div>
    <div class="section-title">QC snapshot</div>
    <div class="card">
      <div class="line-item"><span class="line-label">Items QC'd this period</span><span class="leader"></span><span class="line-amount mono">${qcCount}</span></div>
    </div>
    <div class="section-title">Routine Tasks snapshot <span style="text-transform:none;letter-spacing:0;">(always current, not tied to this period)</span></div>
    <div class="card">
      <div class="line-item"><span class="line-label">Due now or overdue</span><span class="leader"></span><span class="line-amount mono">${dueNow}</span></div>
      <div class="line-item"><span class="line-label">Due within 7 days</span><span class="leader"></span><span class="line-amount mono">${dueSoon}</span></div>
      <div class="line-item"><span class="line-label">Total items tracked</span><span class="leader"></span><span class="line-amount mono">${maintenanceItems.length}</span></div>
    </div>`;
}
function renderOverviewMonth(){
  const { y, m } = overviewMonthCursor;
  const ym = `${y}-${String(m+1).padStart(2,'0')}`;
  const periodIssues = issues.filter(i => i.date.startsWith(ym));
  return `
    <div class="card">
      <div class="nav-row">
        <button class="nav-btn" id="ovPrev">&lsaquo;</button>
        <span class="nav-title">${MONTH_NAMES[m]} ${y}</span>
        <button class="nav-btn" id="ovNext">&rsaquo;</button>
      </div>
      ${periodToggleHTML()}
      <div class="headline-num mono" style="margin-top:14px;">${periodIssues.length}</div>
      <div class="headline-sub">issues logged across all departments</div>
    </div>
    <div class="section-title">By department <span style="text-transform:none;letter-spacing:0;">(tap to see issue types)</span></div>
    <div class="card">${deptBreakdownHTML(periodIssues)}</div>
    ${snapshotsHTML(periodIssues, ym, false)}
  `;
}
function renderOverviewYear(){
  const y = overviewYearCursor;
  const periodIssues = issues.filter(i => i.date.startsWith(String(y)));
  return `
    <div class="card">
      <div class="nav-row">
        <button class="nav-btn" id="ovPrev">&lsaquo;</button>
        <span class="nav-title">${y}</span>
        <button class="nav-btn" id="ovNext">&rsaquo;</button>
      </div>
      ${periodToggleHTML()}
      <div class="headline-num mono" style="margin-top:14px;">${periodIssues.length}</div>
      <div class="headline-sub">issues logged across all departments</div>
    </div>
    <div class="section-title">By department <span style="text-transform:none;letter-spacing:0;">(tap to see issue types)</span></div>
    <div class="card">${deptBreakdownHTML(periodIssues)}</div>
    ${snapshotsHTML(periodIssues, y, true)}
  `;
}
function attachOverviewHandlers(){
  document.querySelectorAll('[data-period]').forEach(btn => {
    btn.onclick = () => { overviewPeriod = btn.getAttribute('data-period'); render(); };
  });
  const prevBtn = document.getElementById('ovPrev');
  const nextBtn = document.getElementById('ovNext');
  if (prevBtn) prevBtn.onclick = () => {
    if (overviewPeriod === 'month') { overviewMonthCursor.m--; if (overviewMonthCursor.m < 0) { overviewMonthCursor.m = 11; overviewMonthCursor.y--; } }
    else { overviewYearCursor--; }
    render();
  };
  if (nextBtn) nextBtn.onclick = () => {
    if (overviewPeriod === 'month') { overviewMonthCursor.m++; if (overviewMonthCursor.m > 11) { overviewMonthCursor.m = 0; overviewMonthCursor.y++; } }
    else { overviewYearCursor++; }
    render();
  };
  document.querySelectorAll('[data-toggle-dept]').forEach(btn => {
    btn.onclick = () => {
      const key = btn.getAttribute('data-toggle-dept');
      expandedDept = expandedDept === key ? null : key;
      render();
    };
  });
}

// ---------- MAINTENANCE (recurring schedule with completion log) ----------
function markMaintenanceComplete(id){
  const item = maintenanceItems.find(m => m.id === id);
  if (!item) return;
  openModal({
    title: 'Mark as complete?',
    text: `Log "${escapeHTML(item.name)}" as done today by ${escapeHTML(currentUser)}.`,
    confirmLabel: 'Mark Complete',
    onConfirm: async () => {
      const log = { id: 'ml' + Date.now() + Math.random().toString(36).slice(2,7), itemId: id, date: todayISO(), completedBy: currentUser, createdAt: Date.now() };
      maintenanceLogs.push(log); cacheLocal(); render(); showToast('Marked complete');
      if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
      try {
        await remotePatchPath('maintenanceLogs', { [log.id]: { itemId: log.itemId, date: log.date, completedBy: log.completedBy, createdAt: log.createdAt } });
        setSyncStatus('synced');
      } catch (e) { setSyncStatus('offline'); showToast("Updated here — will sync once you're back online"); }
    }
  });
}
function renderMaintenance(){
  const items = maintenanceItems.slice().sort((a,b) => daysBetween(todayISO(), nextDueISO(a)) - daysBetween(todayISO(), nextDueISO(b)));
  const canManage = canManageMaintenance();
  const listHTML = items.length ? items.map(item => {
    const due = nextDueISO(item);
    const daysUntil = daysBetween(todayISO(), due);
    const isDue = daysUntil <= 0;
    const statusText = daysUntil === 0 ? 'Due today' : daysUntil < 0 ? `Overdue by ${-daysUntil}d` : `Due in ${daysUntil}d`;
    const logs = maintenanceLogs.filter(l => l.itemId === item.id).sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));
    const lastLog = logs[0];
    const expanded = expandedMaintId === item.id;
    const historyRows = logs.length ? logs.map(l => `<div class="type-row"><span>${formatShortDate(l.date)}</span><span>${escapeHTML(l.completedBy || '—')}</span></div>`).join('')
      : '<div class="type-row"><span>Never completed yet</span><span></span></div>';
    return `
      <div class="issue-row">
        <div class="issue-summary">
          <button class="issue-toggle" data-toggle-maint="${item.id}">
            <span class="line-label">${escapeHTML(item.name)}</span>
            <span class="line-note" style="color:${isDue ? 'var(--warn)' : 'var(--ink-soft)'}">${item.assignedTo ? `${escapeHTML(item.assignedTo)} · ` : ''}${statusText}</span>
          </button>
          <button class="add-btn" style="width:auto; padding:8px 12px; margin:0; font-size:11px;" data-complete-maint="${item.id}">Mark Complete</button>
          ${canManage ? `<button class="del-btn" data-del-maint="${item.id}">&times;</button>` : ''}
        </div>
        ${expanded ? `
          <div class="issue-detail">
            ${scheduleLabel(item)} · Last done: ${lastLog ? `${formatShortDate(lastLog.date)} by ${escapeHTML(lastLog.completedBy || '—')}` : 'never'}
          </div>
          <div class="ov-dept-detail">${historyRows}</div>
        ` : ''}
      </div>`;
  }).join('') : `<div class="empty-state">No routine tasks set up yet.</div>`;

  const addFormHTML = canManage ? `
    <div class="card">
      <div class="dept-title">Routine Tasks</div>
      <label class="field-label" for="maintName">Item name</label>
      <input type="text" id="maintName" placeholder="e.g. Change dust collector filter">
      <label class="field-label" for="maintAssignee">Assigned to</label>
      <select id="maintAssignee">${TEAM.map(n => `<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join('')}</select>
      <label class="field-label" for="maintFreqType">Frequency</label>
      <select id="maintFreqType">
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
      <div id="weeklyFields">
        <label class="field-label" for="maintWeekInterval">Every how many weeks?</label>
        <input type="text" id="maintWeekInterval" inputmode="numeric" pattern="[0-9]*" value="1">
      </div>
      <div id="monthlyFields" style="display:none;">
        <label class="field-label" for="maintOccurrence">Which occurrence?</label>
        <select id="maintOccurrence">
          <option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option>
          <option value="4">4th</option><option value="-1">Last</option>
        </select>
      </div>
      <label class="field-label" for="maintWeekday">Day of week</label>
      <select id="maintWeekday">
        <option value="1">Monday</option><option value="2">Tuesday</option>
        <option value="3">Wednesday</option><option value="4">Thursday</option>
      </select>
      <label class="field-label" for="maintStart">Starting from</label>
      <input type="date" id="maintStart" value="${todayISO()}">
      <button class="add-btn" id="addMaintBtn">+ Add routine task</button>
    </div>` : `
    <div class="card">
      <div class="dept-title">Routine Tasks</div>
      <div class="muted">Only ${MAINT_ADMINS.map(escapeHTML).join(' and ')} can add new routine tasks. You can still mark items complete and view history below.</div>
    </div>`;

  return `
    ${addFormHTML}
    <div class="section-title">Schedule <span style="text-transform:none;letter-spacing:0;">(tap an item for history)</span></div>
    <div class="card">${listHTML}</div>
  `;
}
function attachMaintenanceHandlers(){
  const addBtn = document.getElementById('addMaintBtn');
  if (addBtn) {
    document.getElementById('maintFreqType').onchange = (e) => {
      const isWeekly = e.target.value === 'weekly';
      document.getElementById('weeklyFields').style.display = isWeekly ? 'block' : 'none';
      document.getElementById('monthlyFields').style.display = isWeekly ? 'none' : 'block';
    };
    addBtn.onclick = async () => {
      const nameEl = document.getElementById('maintName');
      const name = nameEl.value.trim();
      const assignedTo = document.getElementById('maintAssignee').value;
      const scheduleType = document.getElementById('maintFreqType').value;
      const weekday = parseInt(document.getElementById('maintWeekday').value, 10);
      const weekInterval = scheduleType === 'weekly' ? (parseInt(document.getElementById('maintWeekInterval').value, 10) || 1) : null;
      const monthlyOccurrence = scheduleType === 'monthly' ? parseInt(document.getElementById('maintOccurrence').value, 10) : null;
      const startDate = document.getElementById('maintStart').value || todayISO();
      if (!name) { nameEl.style.borderColor = 'var(--warn)'; showToast('Enter an item name'); return; }
      const item = { id: 'm' + Date.now() + Math.random().toString(36).slice(2,7), name, assignedTo, scheduleType, weekday, weekInterval, monthlyOccurrence, startDate, createdAt: Date.now() };
      maintenanceItems.push(item); cacheLocal(); render(); showToast('Routine task added');
      if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
      try {
        setSyncStatus('syncing');
        await remotePatchPath('maintenanceItems', { [item.id]: { name: item.name, assignedTo: item.assignedTo, scheduleType: item.scheduleType, weekday: item.weekday, weekInterval: item.weekInterval, monthlyOccurrence: item.monthlyOccurrence, startDate: item.startDate, createdAt: item.createdAt } });
        setSyncStatus('synced');
      } catch (e) { setSyncStatus('offline'); showToast("Saved here — will sync once you're back online"); }
    };
  }
  document.querySelectorAll('[data-toggle-maint]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-toggle-maint');
      expandedMaintId = expandedMaintId === id ? null : id;
      render();
    };
  });
  document.querySelectorAll('[data-complete-maint]').forEach(btn => {
    btn.onclick = () => markMaintenanceComplete(btn.getAttribute('data-complete-maint'));
  });
  if (canManageMaintenance()) {
    document.querySelectorAll('[data-del-maint]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.getAttribute('data-del-maint');
        openModal({
          title: 'Delete this routine task?',
          text: "This removes it and its full completion history for everyone. This can't be undone.",
          confirmLabel: 'Delete',
          onConfirm: async () => {
            const orphanLogIds = maintenanceLogs.filter(l => l.itemId === id).map(l => l.id);
            maintenanceItems = maintenanceItems.filter(m => m.id !== id);
            maintenanceLogs = maintenanceLogs.filter(l => l.itemId !== id);
            cacheLocal(); render(); showToast('Deleted');
            if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
            try {
              const logPatch = {}; orphanLogIds.forEach(lid => { logPatch[lid] = null; });
              await Promise.all([
                remotePatchPath('maintenanceItems', { [id]: null }),
                orphanLogIds.length ? remotePatchPath('maintenanceLogs', logPatch) : Promise.resolve()
              ]);
              setSyncStatus('synced');
            } catch (e) { setSyncStatus('offline'); showToast("Removed here — will sync once you're back online"); }
          }
        });
      };
    });
  }
}

// ---------- main render ----------
function render(){
  const content = document.getElementById('content');
  if (!currentUser) {
    document.getElementById('deptNav').innerHTML = '';
    document.getElementById('identityRow').innerHTML = '';
    content.innerHTML = renderIdentityPicker();
    attachIdentityHandlers();
    return;
  }
  if (activeDept !== 'overview') {
    const currentDept = DEPARTMENTS.find(d => d.key === activeDept);
    if (!currentDept || !isDeptVisible(currentDept)) { activeDept = firstVisibleDept(); }
  }
  renderChips();
  renderMasthead();
  if (activeDept === 'overview') { content.innerHTML = renderOverview(); attachOverviewHandlers(); return; }
  const dept = DEPARTMENTS.find(d => d.key === activeDept);
  if (dept.type === 'standard') { content.innerHTML = renderStandardDept(dept); attachStandardHandlers(dept); }
  else if (dept.type === 'arrow') { content.innerHTML = renderArrow(); attachArrowHandlers(); }
  else if (dept.type === 'maintenance') { content.innerHTML = renderMaintenance(); attachMaintenanceHandlers(); }
  else if (dept.type === 'settings') { content.innerHTML = renderSettings(); attachSettingsHandlers(); }
  else { content.innerHTML = renderQC(); attachQCHandlers(); }
}

// ---------- SETTINGS (Luke H only) ----------
function renderSettings(){
  return `
    <div class="card">
      <div class="dept-title">Settings</div>
      <div class="muted">Only visible to ${escapeHTML(SETTINGS_ADMIN)}.</div>
      <label class="field-label" style="margin-top:20px;">Danger zone</label>
      <button class="text-btn" id="settingsClearBtn" style="color:var(--warn); border-color:var(--warn); margin-top:6px;">Clear all data</button>
    </div>
  `;
}
function attachSettingsHandlers(){
  document.getElementById('settingsClearBtn').onclick = () => {
    openModal({
      title: 'Clear the entire shared log?',
      text: "This deletes every issue, Arrow record, QC entry, and routine task/history — for everyone, permanently. This can't be undone.",
      confirmLabel: 'Clear everything',
      onConfirm: async () => {
        issues = []; arrowJobs = []; qcEntries = []; maintenanceItems = []; maintenanceLogs = [];
        cacheLocal(); render(); showToast('Log cleared');
        if (!isConfigured()) { setSyncStatus('unconfigured'); return; }
        try {
          await Promise.all([
            remoteReplacePath('issues', null), remoteReplacePath('arrowJobs', null), remoteReplacePath('qcEntries', null),
            remoteReplacePath('maintenanceItems', null), remoteReplacePath('maintenanceLogs', null)
          ]);
          setSyncStatus('synced');
        } catch (e) { setSyncStatus('offline'); showToast('Cleared here — will sync once online'); }
      }
    });
  };
}

document.getElementById('refreshBtn').onclick = () => syncPull(true);

function exportBackup(){
  const payload = { exportedAt: new Date().toISOString(), issues, arrowJobs, qcEntries, maintenanceItems, maintenanceLogs };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `shop-floor-log-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}
document.getElementById('backupBtn').onclick = exportBackup;

(async function init(){
  currentUser = loadIdentity();
  loadLocalCache();
  render();
  await syncPull(false);
  if (isConfigured()) {
    setInterval(() => syncPull(false), POLL_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) syncPull(false); });
  }
})();
</script>
</body>
</html>
